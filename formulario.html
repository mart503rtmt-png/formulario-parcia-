<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration</title>
  <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <main class="registroBloque">
      <h1>Registrate</h1>
      <form id="registro">
        <div class="grid">

          <div class="Pegunta">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>
          </div>

          <div class="Pegunta">
            <label for="nombre de usuario">Nombre de usuario:</label>
            <input type="text" id="nombre de usuario" name="nombre de usuario" required>
          </div>

          <div class="Pegunta">
            <label for="correo">Correo:</label>
            <input type="email" id="correo" name="correo" required>
          </div>  

          <div class="Pegunta">
            <label for="telefono">Teléfono:</label>
            <input type="tel" id="telefono" name="telefono" required>
          </div>

          <div class="Pegunta">
            <label for="contraseña">Contraseña:</label>
            <input type="password" id="contraseña" name="contraseña" required>
          </div>

          <div class="Pegunta">
            <label for="confirmar contraseña">Confirmar contraseña:</label>
            <input type="password" id="confirmar contraseña" name="confirmar contraseña" required>
          </div>

          <div class="genero">
            <p> selecciona tu genero:</p>
            <label>
              <input type="radio" name="genero" value="masculino" required> Masculino
            </label>
            <label>
              <input type="radio" name="genero" value="femenino" required> Femenino
            </label>
            <label>
              <input type="radio" name="genero" value="otro" required> Otro
            </label>
          </div>

          <div class="Pegunta">
            <button type="submit">Registrarse</button>
          </div>

        </div>
      </form>
    </main>
</body>
